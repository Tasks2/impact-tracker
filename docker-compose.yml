services:
  postgres:
    image: postgres:16
    container_name: impact-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U impact_user -d impact_tracker"]
      interval: 5s
      timeout: 5s
      retries: 5

  server:
    build: ./server
    container_name: impact-server
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      PORT: 3000
      CLIENT_URL: http://localhost:8080
    ports:
      - "3000:3000"
    volumes:
      - ./server:/app
      - /app/node_modules

  client:
    build: ./client
    container_name: impact-client
    restart: unless-stopped
    depends_on:
      - server
    environment:
      VITE_API_URL: http://localhost:3000/api
    ports:
      - "8080:8080"
    volumes:
      - ./client:/app
      - /app/node_modules

volumes:
  postgres_data: